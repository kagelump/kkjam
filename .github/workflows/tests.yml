name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download Godot
      run: |
        wget https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
        unzip Godot_v4.5.1-stable_linux.x86_64.zip
        chmod +x Godot_v4.5.1-stable_linux.x86_64
    
    - name: Import Assets
      run: |
        # Import all assets before running tests to avoid hanging
        ./Godot_v4.5.1-stable_linux.x86_64 --headless --import --quit
        
    - name: Run Tests
      run: |
        ./Godot_v4.5.1-stable_linux.x86_64 --headless -s test/run_tests.gd
        
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: .gut_editor_config.json
